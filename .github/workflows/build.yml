name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Build
        run: |
          unzip -o cruzzingt.zip
          GRADLEW=$(find . -name gradlew | head -n 1)
          chmod +x $GRADLEW
          DIR=$(dirname $GRADLEW)
          cd $DIR
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cruzzingt-apk
          path: "**/app-debug.apk"
