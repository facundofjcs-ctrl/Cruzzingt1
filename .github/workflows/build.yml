name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip cruzzingt.zip
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: chmod +x cruzzingt/gradlew
      - run: cd cruzzingt && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cruzzingt-apk
          path: cruzzingt/app/build/outputs/apk/debug/app-debug.apk
